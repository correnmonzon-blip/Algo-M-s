<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algo+ · Pedí para llevar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F1EBDD;--band:#CDBFA3;--ink:#1B3A29;--cu:#A8683A;--card:#FBF8F0;--line:#d9cdb2;--on:#F1EBDD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13241a;--band:#CDBFA3;--ink:#EFE8D6;--cu:#D79A63;--card:#1c3225;--line:#34503f;--on:#13241a}}
:root[data-theme="dark"]{--bg:#13241a;--band:#CDBFA3;--ink:#EFE8D6;--cu:#D79A63;--card:#1c3225;--line:#34503f;--on:#13241a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 'DM Sans',system-ui,sans-serif;padding-bottom:96px}
button{font:inherit;cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.top{background:var(--band);text-align:center;padding:18px 18px 22px;color:#1B3A29}
.top img{width:132px;height:132px;display:block;margin:0 auto 6px;border-radius:50%}
.top p{margin:0;font-weight:500}
.w{max-width:560px;margin:0 auto;padding:0 16px}
h2{font:400 46px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.5px;margin:26px 0 12px;text-shadow:3px 3px 0 var(--band);color:var(--ink)}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.ph{position:relative;height:190px;background-size:cover;background-position:center}
.badge{position:absolute;left:12px;bottom:-26px;background:#1B3A29;color:#F1EBDD;border-radius:50%;width:84px;height:84px;display:grid;place-items:center;font:400 28px 'Bebas Neue',Impact,sans-serif;border:3px solid var(--card)}
.cb{padding:18px 16px 16px 108px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:84px}
.cb b{font-size:18px;line-height:1.2}
.add{background:var(--ink);color:var(--on);border-radius:999px;padding:11px 20px;font-weight:700;flex-shrink:0}
.st{display:flex;align-items:center;gap:6px;flex-shrink:0}
.st button{width:40px;height:40px;border-radius:50%;background:var(--cu);color:#fff;font-size:22px;line-height:1}
.st span{min-width:24px;text-align:center;font-weight:700;font-size:18px}
.it{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.th{width:60px;height:60px;border-radius:14px;background:var(--band) center/cover;display:grid;place-items:center;font-size:30px;flex-shrink:0}
.it .tx{flex:1;min-width:0}.it .tx b{display:block}.it .tx small{opacity:.7}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.chips a{flex-shrink:0;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
h2{scroll-margin-top:64px;font-size:38px}.em{display:grid;place-items:center;font-size:64px;background:var(--band)}.pc{font-weight:700;white-space:nowrap}
.foot{text-align:center;opacity:.8;margin:26px 0 8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none}
.bar.on{display:block}
.big{display:flex;justify-content:space-between;width:100%;max-width:528px;margin:0 auto;padding:16px 20px;border-radius:16px;background:var(--cu);color:#fff;font-weight:700;font-size:17px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sp{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sp h3{font:400 34px 'Bebas Neue',Impact,sans-serif;margin:0 0 8px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sp input{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:14px 0 6px}
.sp small{display:block;opacity:.75;margin-bottom:12px}
.x{background:none;color:var(--ink);float:right;font-size:26px;padding:0 6px}
.wa{width:100%;padding:16px;border-radius:16px;background:#1B8A4B;color:#fff;font-weight:700;font-size:17px}
</style></head><body>
